  <!-- Left Panel Headline & Subcopy -->
  <text x="40" y="216" fill="#0A0A0A" font-size="24" font-weight="700" class="sans">面向 AI Coding Agent 的本地语义文档定位工具</text>
  <text x="40" y="250" fill="#0A0A0A" font-size="14" font-weight="500" class="sans">自然语言与发散候选词进入，Markdown 文件、章节和行号以紧凑导航树返回。</text>
