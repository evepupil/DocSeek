  <line x1="740" y1="216" x2="1198.5" y2="216" stroke="#0A0A0A" stroke-width="2"/>

  <rect x="762" y="236" width="12" height="12" fill="#A98BF7"/>
  <text x="784" y="247" fill="#0A0A0A" font-size="13" font-weight="700" class="mono">03 / ZERO-MCP PURE CLI</text>
