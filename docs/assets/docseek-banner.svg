  <text x="784" y="75" fill="#0A0A0A" font-size="13" font-weight="700" class="mono">01 / HYBRID RECALL</text>
  <text x="762" y="102" fill="#0A0A0A" font-size="14" font-weight="500" class="sans">sqlite-vec (0.45) + FTS5 (0.55)，RRF k=8 融合</text>
  <line x1="740" y1="130" x2="1198.5" y2="130" stroke="#0A0A0A" stroke-width="2"/>

  <rect x="762" y="150" width="12" height="12" fill="#2BA676"/>
