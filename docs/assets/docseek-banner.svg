    <rect x="0" y="0" width="25" height="4.04"/><rect x="45" y="0" width="25" height="4.04"/><rect x="85" y="0" width="25" height="4.04"/><rect x="125" y="0" width="25" height="4.04"/><rect x="160" y="0" width="35" height="4.04"/><rect x="200" y="0" width="35" height="4.04"/><rect x="240" y="0" width="10" height="4.04"/><rect x="265" y="0" width="10" height="4.04"/>
