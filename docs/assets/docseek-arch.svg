<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" shape-rendering="crispEdges" role="img" aria-label="DocSeek 系统架构图">
  <style>
    .sans { font-family: "Inter Tight", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <!-- Canvas & Frame -->
  <rect x="0" y="0" width="1200" height="490" fill="#FFFFFF"/>
  <rect x="1.5" y="1.5" width="1197" height="487" fill="none" stroke="#0A0A0A" stroke-width="3"/>

  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="44" fill="#0A0A0A"/>
  <text x="24" y="27" fill="#F3ACF0" font-size="13" font-weight="700" class="mono">ARCHITECTURE // DOCSEEK v0.2.0</text>
  <text x="1176" y="27" text-anchor="end" fill="#FFFFFF" font-size="12" font-weight="500" class="mono">SINGLE-PROCESS CLI · NO DAEMON · NO MCP REQUIRED</text>

  <!-- Column Headers -->
  <rect x="24" y="64" width="252" height="32" fill="#F3ACF0" stroke="#0A0A0A" stroke-width="2"/>
  <text x="150" y="85" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700" class="mono">01 / AI CODING AGENTS</text>

  <rect x="324" y="64" width="252" height="32" fill="#F3ACF0" stroke="#0A0A0A" stroke-width="2"/>
  <text x="450" y="85" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700" class="mono">02 / CLI &amp; OUTPUT LAYER</text>

  <rect x="624" y="64" width="252" height="32" fill="#F3ACF0" stroke="#0A0A0A" stroke-width="2"/>
  <text x="750" y="85" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700" class="mono">03 / INDEX &amp; HYBRID ENGINE</text>

  <rect x="924" y="64" width="252" height="32" fill="#F3ACF0" stroke="#0A0A0A" stroke-width="2"/>
  <text x="1050" y="85" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700" class="mono">04 / LOCAL SQLITE &amp; CACHE</text>

  <!-- COLUMN 1: CODING AGENTS -->
  <g>
    <rect x="24" y="114" width="252" height="74" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="24" y="114" width="8" height="74" fill="#2370E8"/>
    <text x="44" y="142" fill="#0A0A0A" font-size="16" font-weight="700" class="sans">Claude Code</text>
    <text x="44" y="168" fill="#0A0A0A" font-size="12" font-weight="500" class="mono">自动维护 ~/.claude/CLAUDE.md</text>

    <rect x="24" y="204" width="252" height="74" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="24" y="204" width="8" height="74" fill="#2BA676"/>
    <text x="44" y="232" fill="#0A0A0A" font-size="16" font-weight="700" class="sans">Codex CLI</text>
    <text x="44" y="258" fill="#0A0A0A" font-size="12" font-weight="500" class="mono">自动维护 ~/.codex/AGENTS.md</text>

    <rect x="24" y="294" width="252" height="74" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="24" y="294" width="8" height="74" fill="#A98BF7"/>
    <text x="44" y="322" fill="#0A0A0A" font-size="16" font-weight="700" class="sans">Cursor · Gemini · OpenCode</text>
    <text x="44" y="348" fill="#0A0A0A" font-size="12" font-weight="500" class="mono">docseek instructions + Shell</text>

    <rect x="24" y="384" width="252" height="74" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="24" y="384" width="8" height="74" fill="#FF5A5A"/>
    <text x="44" y="412" fill="#0A0A0A" font-size="15" font-weight="700" class="sans">任意 Shell Agent · CI 脚本</text>
    <text x="44" y="438" fill="#0A0A0A" font-size="12" font-weight="500" class="mono">stdout 纯文本/JSON · 严格退出码</text>
  </g>

  <!-- COLUMN 2: CLI & OUTPUT LAYER -->
  <g>
    <rect x="324" y="114" width="252" height="104" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="324" y="114" width="252" height="28" fill="#2370E8"/>
    <text x="338" y="133" fill="#FFFFFF" font-size="12" font-weight="700" class="mono">SEARCH &amp; COMPACT TREE</text>
    <text x="338" y="162" fill="#0A0A0A" font-size="13" font-weight="700" class="mono">docseek search &lt;terms...&gt;</text>
    <text x="338" y="184" fill="#0A0A0A" font-size="12" class="sans">单分支 / 与 › 折叠 (-80% 字符)</text>
    <text x="338" y="203" fill="#0A0A0A" font-size="12" class="sans">支持 --top / --path / --json / --explain</text>

    <rect x="324" y="234" width="252" height="104" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="324" y="234" width="252" height="28" fill="#2BA676"/>
    <text x="338" y="253" fill="#FFFFFF" font-size="12" font-weight="700" class="mono">LIFECYCLE COMMANDS</text>
    <text x="338" y="282" fill="#0A0A0A" font-size="13" font-weight="700" class="mono">init · status · update</text>
    <text x="338" y="304" fill="#0A0A0A" font-size="12" class="sans">status 零模型加载巡检变更</text>
    <text x="338" y="323" fill="#0A0A0A" font-size="12" class="sans">update 按内容哈希增量重建</text>

    <rect x="324" y="354" width="252" height="104" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="324" y="354" width="252" height="28" fill="#A98BF7"/>
    <text x="338" y="373" fill="#0A0A0A" font-size="12" font-weight="700" class="mono">AGENT INSTRUCTIONS</text>
    <text x="338" y="402" fill="#0A0A0A" font-size="13" font-weight="700" class="mono">docseek instructions</text>
    <text x="338" y="424" fill="#0A0A0A" font-size="12" class="sans">闭合标签幂等注入与升级</text>
    <text x="338" y="443" fill="#0A0A0A" font-size="12" class="sans">解析时自动屏蔽自身规则块</text>
  </g>

  <!-- COLUMN 3: ENGINE -->
  <g>
    <rect x="624" y="114" width="252" height="104" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="624" y="114" width="252" height="28" fill="#FF5A5A"/>
    <text x="638" y="133" fill="#FFFFFF" font-size="12" font-weight="700" class="mono">SEARCH // 双路混合融合</text>
    <text x="638" y="164" fill="#0A0A0A" font-size="13" font-weight="600" class="sans">Vec 0.45 + FTS5 0.55 (RRF k=8)</text>
    <text x="638" y="186" fill="#0A0A0A" font-size="12" class="sans">绝对分 = 融合0.6+覆盖0.2+语义0.2</text>
    <text x="638" y="205" fill="#0A0A0A" font-size="12" class="sans">发散词词汇证据与低可信过滤</text>

    <rect x="624" y="234" width="252" height="104" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="624" y="234" width="252" height="28" fill="#0A0A0A"/>
    <text x="638" y="253" fill="#F3ACF0" font-size="12" font-weight="700" class="mono">MARKDOWN // AST 分块</text>
    <text x="638" y="284" fill="#0A0A0A" font-size="13" font-weight="600" class="sans">mdast 标题层级 + 源码行号</text>
    <text x="638" y="306" fill="#0A0A0A" font-size="12" class="sans">超长章节按段落/列表/代码块切分</text>
    <text x="638" y="325" fill="#0A0A0A" font-size="12" class="sans">SHA-256 内容哈希跳过未变化文件</text>

    <rect x="624" y="354" width="252" height="104" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="624" y="354" width="252" height="28" fill="#0A0A0A"/>
    <text x="638" y="373" fill="#FFFFFF" font-size="12" font-weight="700" class="mono">EMBEDDING // 批量向量化</text>
    <text x="638" y="404" fill="#0A0A0A" font-size="13" font-weight="600" class="sans">multilingual-e5-small q8 (384D)</text>
    <text x="638" y="426" fill="#0A0A0A" font-size="12" class="sans">跨文件按长度分桶批量推理</text>
    <text x="638" y="445" fill="#0A0A0A" font-size="12" class="sans">超长输入保留头尾 token</text>
  </g>

  <!-- COLUMN 4: LOCAL STORAGE -->
  <g>
    <rect x="924" y="114" width="252" height="104" fill="#F3ACF0" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="924" y="114" width="10" height="104" fill="#2370E8"/>
    <text x="946" y="142" fill="#0A0A0A" font-size="13" font-weight="700" class="mono">.docseek/index.db</text>
    <text x="946" y="166" fill="#0A0A0A" font-size="13" font-weight="600" class="sans">SQLite 统一单文件索引</text>
    <text x="946" y="188" fill="#0A0A0A" font-size="12" class="mono">sqlite-vec + FTS5 + 11 Tables</text>
    <text x="946" y="206" fill="#0A0A0A" font-size="12" class="mono">事务更新 · 自动 .gitignore</text>

    <rect x="924" y="234" width="252" height="104" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="924" y="234" width="10" height="104" fill="#2BA676"/>
    <text x="946" y="262" fill="#0A0A0A" font-size="13" font-weight="700" class="mono">.docseek/config.toml</text>
    <text x="946" y="286" fill="#0A0A0A" font-size="13" font-weight="600" class="sans">版本化项目配置与来源</text>
    <text x="946" y="308" fill="#0A0A0A" font-size="12" class="mono">向上自动定位 Git 根目录</text>
    <text x="946" y="326" fill="#0A0A0A" font-size="12" class="mono">预留 add / tags / 多集合</text>

    <rect x="924" y="354" width="252" height="104" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="924" y="354" width="10" height="104" fill="#A98BF7"/>
    <text x="946" y="382" fill="#0A0A0A" font-size="13" font-weight="700" class="mono">~/.cache/ (Model Cache)</text>
    <text x="946" y="406" fill="#0A0A0A" font-size="13" font-weight="600" class="sans">用户级本地模型缓存</text>
    <text x="946" y="428" fill="#0A0A0A" font-size="12" class="mono">118 MB q8 首次下载复用</text>
    <text x="946" y="446" fill="#0A0A0A" font-size="12" class="mono">离线运行 · 零云端 API</text>
  </g>

  <!-- Orthogonal Connectors -->
  <g stroke="#0A0A0A" stroke-width="2" fill="none">
    <line x1="276" y1="151" x2="320" y2="151"/>
    <line x1="276" y1="241" x2="300" y2="241"/><line x1="300" y1="176" x2="300" y2="286"/><line x1="300" y1="176" x2="320" y2="176"/><line x1="300" y1="286" x2="320" y2="286"/>
    <line x1="276" y1="331" x2="300" y2="331"/><line x1="300" y1="331" x2="300" y2="406"/><line x1="300" y1="406" x2="320" y2="406"/>
    <line x1="276" y1="421" x2="320" y2="421"/>

    <line x1="576" y1="166" x2="620" y2="166"/>
    <line x1="576" y1="286" x2="620" y2="286"/>
    <line x1="576" y1="406" x2="620" y2="406"/>

    <line x1="876" y1="166" x2="920" y2="166"/>
    <line x1="876" y1="286" x2="920" y2="286"/>
    <line x1="876" y1="406" x2="920" y2="406"/>
  </g>

  <!-- Pixel Arrowheads -->
  <g fill="#0A0A0A">
    <rect x="316" y="147" width="6" height="8"/><rect x="316" y="172" width="6" height="8"/><rect x="316" y="282" width="6" height="8"/><rect x="316" y="402" width="6" height="8"/><rect x="316" y="417" width="6" height="8"/>
    <rect x="616" y="162" width="6" height="8"/><rect x="616" y="282" width="6" height="8"/><rect x="616" y="402" width="6" height="8"/>
    <rect x="916" y="162" width="6" height="8"/><rect x="916" y="282" width="6" height="8"/><rect x="916" y="402" width="6" height="8"/>
  </g>
</svg>
